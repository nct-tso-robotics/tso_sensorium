# Force-sensing session: UR5e state, endoscope, camera transform, and Bota sensor.
output_folder: ~/tso_sensorium_recordings
episode_name: null
record_rosbag: false
rosbag_topics: []

recorders:
  - type: topic
    file_name: ur5e
    topic_name: /ur5e_rcm_twist_controller/RobotState
    message_type: testbed_msgs.msg.RobotState
    queue_size: 100
    fields:
      - joints_state
      - robot_pose
      - robot_space_initial_tip_position
      - relative_tip_position
      - robot_space_rcm_position
      - robot_space_wrench
      - relative_pivot_RPY
      - relative_pivot_translation
    csv_header:
      - joints_state
      - robot_pose
      - robot_space_initial_tip_position
      - relative_tip_position
      - robot_space_rcm_position
      - robot_space_wrench
      - relative_pivot_rpy
      - relative_pivot_translation

  - type: topic
    file_name: robot_camera_transform
    topic_name: /robot_camera_transform
    message_type: geometry_msgs.msg.TransformStamped
    queue_size: 100
    fields:
      - transform.rotation.x
      - transform.rotation.y
      - transform.rotation.z
      - transform.rotation.w
    csv_header:
      - quaternion_x
      - quaternion_y
      - quaternion_z
      - quaternion_w

  - type: video
    file_name: laparoscope_left
    topic_name: /endoscope/left/image_raw
    liveness_topic: /endoscope/left/camera_info
    liveness_message_type: sensor_msgs.msg.CameraInfo
    frames_per_second: 30.0
    queue_size: 10

  - type: video
    file_name: laparoscope_right
    topic_name: /endoscope/right/image_raw
    liveness_topic: /endoscope/right/camera_info
    liveness_message_type: sensor_msgs.msg.CameraInfo
    frames_per_second: 30.0
    queue_size: 10

  - type: video
    file_name: laparoscope_combined
    topic_name: /endoscope/capture/image_raw
    liveness_topic: /endoscope/capture/camera_info
    liveness_message_type: sensor_msgs.msg.CameraInfo
    frames_per_second: 10.0
    lossless_compression: true
    queue_size: 10

  - type: topic
    file_name: bota_wrench
    topic_name: /bota_sensor_publisher/wrench
    message_type: geometry_msgs.msg.WrenchStamped
    queue_size: 100
    fields:
      - header.seq
      - header.stamp
      - header.frame_id
      - wrench.force.x
      - wrench.force.y
      - wrench.force.z
      - wrench.torque.x
      - wrench.torque.y
      - wrench.torque.z

  - type: topic
    file_name: bota_imu
    topic_name: /bota_sensor_publisher/imu
    message_type: sensor_msgs.msg.Imu
    queue_size: 100
    fields:
      - header.seq
      - header.stamp
      - header.frame_id
      - orientation.x
      - orientation.y
      - orientation.z
      - orientation.w
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z
