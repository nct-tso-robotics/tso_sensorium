# Recording session for the TSO testbed without the Bota sensor.
# Disable a stream by removing or commenting its entry.
output_folder: ""
episode_name: null
record_rosbag: false
rosbag_topics:
  - /ur5e_rcm_twist_controller/RobotState
  - /robot_camera_transform
  - /koala_grasper/state
  - /pedal_board/state

recorders:
  - type: topic
    file_name: ur5e
    topic_name: /ur5e_rcm_twist_controller/RobotState
    message_type: testbed_msgs.msg.RobotState
    queue_size: 100
    fields:
      - joints_state
      - robot_pose
      - robot_space_initial_tip_position
      - relative_tip_position
      - robot_space_rcm_position
      - robot_space_wrench
      - relative_pivot_RPY
      - relative_pivot_translation
    csv_header:
      - joints_state
      - robot_pose
      - robot_space_initial_tip_position
      - relative_tip_position
      - robot_space_rcm_position
      - robot_space_wrench
      - relative_pivot_rpy
      - relative_pivot_translation

  - type: topic
    file_name: robot_camera_transform
    topic_name: /robot_camera_transform
    message_type: geometry_msgs.msg.TransformStamped
    fields:
      - transform.rotation.x
      - transform.rotation.y
      - transform.rotation.z
      - transform.rotation.w
    csv_header:
      - quaternion_x
      - quaternion_y
      - quaternion_z
      - quaternion_w

  - type: topic
    file_name: koala_grasp
    topic_name: /koala_grasper/state
    message_type: testbed_msgs.msg.KoalaCommand
    required: false
    fields: [open]

  - type: topic
    file_name: pedal_board
    topic_name: /pedal_board/state
    message_type: testbed_msgs.msg.PedalBoardState
    required: false
    fields:
      - right_blue_pedal
      - left_blue_pedal
      - right_yellow_pedal
      - left_yellow_pedal
      - top_grey_pedal
      - bottom_grey_pedal
      - flap

  - type: video
    file_name: laparoscope_left
    topic_name: /endoscope/left/image_raw
    liveness_topic: /endoscope/left/camera_info
    liveness_message_type: sensor_msgs.msg.CameraInfo
    frames_per_second: 30

  - type: video
    file_name: laparoscope_right
    topic_name: /endoscope/right/image_raw
    liveness_topic: /endoscope/right/camera_info
    liveness_message_type: sensor_msgs.msg.CameraInfo
    frames_per_second: 30

  - type: video
    file_name: laparoscope_combined
    topic_name: /endoscope/capture/image_raw
    liveness_topic: /endoscope/capture/camera_info
    liveness_message_type: sensor_msgs.msg.CameraInfo
    frames_per_second: 10
    lossless_compression: true
