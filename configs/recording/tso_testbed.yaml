# Recording session for the TSO testbed (UR5e + STORZ endoscope).
# Disable a stream by removing or commenting its entry.
output_folder: ""
episode_name: null
record_rosbag: false
rosbag_topics:
  - /ur5e_rcm_twist_controller/RobotState
  - /robot_camera_transform
  - /bota_force_sensor_state
  - /koala_grasper/state
  - /pedal_board/state

recorders:
  - type: topic
    file_name: ur5e
    topic_name: /ur5e_rcm_twist_controller/RobotState
    message_type: testbed_msgs.msg.RobotState
    fields:
      - joints_state
      - robot_pose
      - robot_space_initial_tip_position
      - relative_tip_position
      - robot_space_rcm_position
      - robot_space_wrench
    csv_header:
      - jointsState
      - robot_pose
      - robot_space_initial_tip_position
      - relative_tip_position
      - robot_space_rcm_position
      - robot_space_wrench

  - type: topic
    file_name: robot_camera_transform
    topic_name: /robot_camera_transform
    message_type: geometry_msgs.msg.TransformStamped
    fields:
      - transform.rotation.x
      - transform.rotation.y
      - transform.rotation.z
      - transform.rotation.w
    csv_header:
      - quaternion_x
      - quaternion_y
      - quaternion_z
      - quaternion_w

  - type: topic
    file_name: bota_force_sensor
    topic_name: /bota_force_sensor_state
    message_type: testbed_msgs.msg.ForceSensorState
    fields: [wrench, temperature, imu, throttled, overrange, invalid]

  - type: topic
    file_name: koala_grasp
    topic_name: /koala_grasper/state
    message_type: testbed_msgs.msg.KoalaCommand
    fields: [open]

  - type: topic
    file_name: pedal_board
    topic_name: /pedal_board/state
    message_type: testbed_msgs.msg.PedalBoardState
    fields:
      - right_blue_pedal
      - left_blue_pedal
      - right_yellow_pedal
      - left_yellow_pedal
      - top_grey_pedal
      - bottom_grey_pedal
      - flap

  - type: video
    file_name: laparoscope_left
    topic_name: /laparoscope/camera/left/image_raw
    frames_per_second: 30

  - type: video
    file_name: laparoscope_right
    topic_name: /laparoscope/camera/right/image_raw
    frames_per_second: 30

  - type: video
    file_name: laparoscope_combined
    topic_name: /stereo/camera_driver/image_raw
    frames_per_second: 10
    lossless_compression: true
